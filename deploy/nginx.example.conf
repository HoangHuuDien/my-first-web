# /etc/nginx/sites-available/my-first-web
# sudo ln -s ... sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;

    # certbot sẽ thêm listen 443 sau khi chạy: certbot --nginx -d your-domain.com

    root /var/www/my-first-web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Khuyến nghị: bảo vệ admin
    # location /admin {
    #     auth_basic "Admin";
    #     auth_basic_user_file /etc/nginx/.htpasswd_admin;
    #     try_files $uri $uri/ /admin/index.html;
    # }
}
