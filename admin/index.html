<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Thuận Thiên</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css?v=21">
</head>
<body>
  <header class="top">
    <div>
      <h1>Brain Admin</h1>
      <p class="sub">Sản phẩm · Khách hàng · <strong>Kiến thức/FAQ</strong> · <strong>Đơn hàng</strong></p>
    </div>
    <div class="stats loading" id="stats" aria-live="polite">Đang tải thống kê…</div>
  </header>

  <p id="admin-banner" class="admin-banner hidden" role="alert" aria-live="assertive"></p>

  <main class="layout">
    <aside class="sidebar">
      <label class="lbl" for="search">Bảng &amp; tìm kiếm</label>
      <nav class="tabs" id="tabs">
        <button type="button" data-view="products" class="active">Sản phẩm</button>
        <button type="button" data-view="customers">Khách hàng</button>
        <button type="button" data-view="knowledge">Kiến thức / FAQ</button>
        <button type="button" data-view="orders">Đơn hàng</button>
      </nav>
      <input type="search" id="search" placeholder="Tìm theo tab đang chọn…">
      <button type="button" class="btn secondary" id="btn-refresh">Làm mới</button>
      <button type="button" class="btn primary" id="btn-new">+ Thêm bản ghi</button>
    </aside>

    <section class="panel">
      <div class="list-wrap">
        <table>
          <thead id="list-head"></thead>
          <tbody id="list-body"></tbody>
        </table>
        <p id="list-empty" class="empty hidden">Không có dữ liệu</p>
      </div>

      <article class="editor hidden" id="editor">
        <h2 id="editor-title">Chi tiết</h2>

        <form id="form-content" class="editor-form">
          <input type="hidden" id="f-id">
          <div class="grid">
            <label>Slug <input id="f-slug" required></label>
            <label>Source path <input id="f-source" required></label>
          </div>
          <label>Tiêu đề <input id="f-title" required></label>
          <label class="field-products">Gợi ý giá <input id="f-price"></label>
          <label class="field-customers">Tags <input id="f-tags"></label>
          <label class="field-knowledge">Category <input id="f-category"></label>
          <label class="field-knowledge">Sản phẩm liên quan <input id="f-related"></label>
          <label>Nội dung (markdown) <textarea id="f-content" rows="14"></textarea></label>
          <div class="actions">
            <button type="submit" class="btn primary">Lưu</button>
            <button type="button" class="btn danger" id="btn-delete">Xóa</button>
            <button type="button" class="btn secondary" id="btn-cancel">Đóng</button>
          </div>
        </form>

        <form id="form-order" class="editor-form hidden">
          <input type="hidden" id="o-id">
          <label>Khách hàng <input id="o-name" required></label>
          <label>SĐT <input id="o-phone"></label>
          <label>Email <input id="o-email" type="email"></label>
          <label>Số tiền (VND) <input id="o-amount" type="number" min="0" step="1000" required></label>
          <label>Mã CK (transaction_code) <input id="o-txcode" readonly></label>
          <label>Trạng thái
            <select id="o-status" required>
              <option value="pending">pending</option>
              <option value="paid">paid</option>
              <option value="success">success</option>
              <option value="cancelled">cancelled</option>
            </select>
          </label>
          <label>Ghi chú sản phẩm <input id="o-note"></label>
          <label>Nội dung CK <textarea id="o-transfer" rows="3" readonly></textarea></label>
          <p class="order-meta" id="o-created"></p>
          <div class="actions">
            <button type="submit" class="btn primary">Cập nhật đơn</button>
            <button type="button" class="btn danger" id="btn-delete-order">Xóa</button>
            <button type="button" class="btn secondary" id="btn-cancel-order">Đóng</button>
          </div>
        </form>

        <p id="form-msg" class="msg" aria-live="polite"></p>
      </article>
    </section>
  </main>

  <script src="/admin/admin.js?v=21"></script>
</body>
</html>
